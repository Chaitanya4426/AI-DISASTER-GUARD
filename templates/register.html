{% extends "base.html" %}

{% block content %}
<section class="auth-shell">
  <div class="auth-card">
    <div class="auth-header">
      <span class="section-tag">Create account</span>
      <h2>Register</h2>
    </div>
    <form method="post" class="auth-form">
      <label>Username<input type="text" name="username" placeholder="Choose a username" required /></label>
      <label>Email<input type="email" name="email" placeholder="your@email.com" required /></label>
      <label>Role
        <select name="role">
          <option value="registered_user">Registered user</option>
          <option value="disaster_analyst">Disaster analyst</option>
          <option value="administrator">Administrator</option>
        </select>
      </label>
      <label>Password<input type="password" name="password" placeholder="Minimum 8 characters" required /></label>
      <button type="submit" class="primary-btn">Create account</button>
      <div class="auth-links">
        <a href="{{ url_for('login') }}">Already have an account?</a>
      </div>
    </form>
  </div>
</section>
{% endblock %}
