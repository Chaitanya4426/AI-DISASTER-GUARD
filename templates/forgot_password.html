{% extends "base.html" %}

{% block content %}
<section class="auth-shell">
  <div class="auth-card">
    <div class="auth-header">
      <span class="section-tag">Account recovery</span>
      <h2>Forgot Password</h2>
    </div>
    <form method="post" class="auth-form">
      <label>Email<input type="email" name="email" placeholder="Enter your registered email" required /></label>
      <button type="submit" class="primary-btn">Send reset link</button>
    </form>
  </div>
</section>
{% endblock %}
