{% extends "base.html" %}

{% block content %}
<section class="auth-shell">
  <div class="auth-card">
    <div class="auth-header">
      <span class="section-tag">Access portal</span>
      <h2>Login</h2>
    </div>
    <form method="post" class="auth-form">
      <label>Username or email<input type="text" name="identifier" placeholder="Enter username or email" required /></label>
      <label>Password<input type="password" name="password" placeholder="Enter password" required /></label>
      <button type="submit" class="primary-btn">Sign in</button>
      <div class="auth-links">
        <a href="{{ url_for('register') }}">Create account</a>
        <a href="{{ url_for('forgot_password') }}">Forgot password?</a>
      </div>
    </form>
  </div>
</section>
{% endblock %}
